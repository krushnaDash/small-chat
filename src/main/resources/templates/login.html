<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NC Login</title>
  <style>
    :root { --orange:#FF8C00; --orange-dark:#FF7700; --orange-light:#FFE4CC; --bg:#fafbfc; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      background: linear-gradient(135deg, #FF8C00 0%, #FF7700 100%);
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wrap { 
      width: 100%;
      max-width: 420px;
      animation: slideUp 0.6s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card { 
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #FF8C00, #FF7700);
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, #FF8C00, #FF7700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    h1 { 
      margin: 0 0 8px 0;
      font-size: 28px;
      color: #1a1a1a;
      font-weight: 700;
    }
    p { 
      margin: 0;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }
    .row { 
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 24px;
    }
    .input-group {
      position: relative;
    }
    .input { 
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      width: 100%;
      transition: all 0.3s ease;
      background: #fafbfc;
    }
    .input:focus {
      outline: none;
      border-color: #FF8C00;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
    }
    .btn { 
      background: linear-gradient(135deg, #FF8C00, #FF7700);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
      transition: all 0.3s ease;
      margin-top: 8px;
      box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
    }
    .btn:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
    }
    .btn:active {
      transform: translateY(0);
    }
    .error { 
      color: #b42318;
      background: #fee4e2;
      border: 1px solid #fda29b;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
      animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .note { 
      color: #999;
      font-size: 12px;
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }
    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <form class="card" method="post" action="/login">
      <div class="header">
        <div class="logo">NC</div>
        <h1>Welcome Back</h1>
        <p>Enter your password to access the chat</p>
      </div>
      <div id="errorBox" class="error" style="display:none;"></div>
      <div class="row">
        <div class="input-group">
          <input class="input" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>
        <input type="hidden" name="redirect" id="redirect" />
        <button class="btn" type="submit">Continue to Chat</button>
        <div class="note">Forgot your password? Contact the site administrator for assistance.</div>
      </div>
    </form>
  </div>
  <script>
    // Populate redirect and show errors
    const params = new URLSearchParams(location.search);
    const redir = params.get('redirect') || '/';
    document.getElementById('redirect').value = redir;
    const error = params.get('error');
    const hasPassword = true; // server ensures page only shown if password is configured
    if (error) {
      const box = document.getElementById('errorBox');
      box.style.display = 'block';
      box.textContent = error === 'nopass' ? 'Login disabled: no password configured on server.' : 'Incorrect password. Please try again.';
    }
  </script>
</body>
</html>
